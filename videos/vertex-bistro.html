<style>
/* Layout: a fixed 1280x720 stage scaled to fit, HUD (scene title, progress, subtitles) over it. Single look: the app's own sunny palette. */
:root{--cream:#FFF8EC;--ink:#1F2A44;--coral:#FF6B4A;--brand:#D9480F;--teal:#06A97F;--sun:#FFC21A;--blue:#4C6FFF;--pink:#FF3D7F;--violet:#845EF7;--night:#141B2E;--line:#E9DFCC;--muted:#5B6478;
--head:'Unbounded','Arial Black',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--cream);position:absolute;left:50%;top:50%;transform-origin:center;border-radius:18px}
#scene{position:absolute;inset:0}#curtain{position:absolute;inset:0;z-index:15;pointer-events:none;background:var(--coral);clip-path:circle(0% at 50% 55%)}#curtain.go{animation:curtain .9s cubic-bezier(.7,0,.2,1)}@keyframes curtain{0%{clip-path:circle(0% at 50% 55%)}45%{clip-path:circle(85% at 50% 55%)}100%{clip-path:circle(85% at 50% 55%);opacity:0}}
#top{position:absolute;left:28px;top:22px;z-index:20;display:flex;gap:12px;align-items:center}
#top img{width:42px;height:42px;border-radius:10px}
#stitle{font:800 15px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:9px 14px;border-radius:999px}
#cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(980px,90%);text-align:center;font:600 19px/1.4 var(--body);color:#fff;background:rgba(20,27,46,.78);padding:8px 16px;border-radius:12px;z-index:20}
#cap[hidden]{display:none}
#bar{position:absolute;left:28px;right:28px;bottom:16px;height:8px;display:flex;gap:4px;z-index:20}
#bar button{flex:var(--w);border:0;padding:0;border-radius:4px;background:rgba(31,42,68,.18);cursor:pointer;position:relative;overflow:hidden}
#bar button i{position:absolute;inset:0;width:0;background:var(--coral)}
#bar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#help{position:absolute;right:28px;top:26px;z-index:20;font:600 13px var(--body);color:var(--ink);background:rgba(255,255,255,.85);padding:7px 12px;border-radius:999px}
#pausedTag{position:absolute;inset:0;display:none;place-items:center;z-index:30;background:rgba(20,27,46,.35);font:800 40px var(--head);color:#fff}
body.paused #pausedTag{display:grid}
body.paused #scene *, body.paused #scene{animation-play-state:paused!important}
/* building blocks */
.abs{position:absolute}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--cream) 0%,rgba(255,248,236,.92) 42%,rgba(255,248,236,0) 75%)}
.h1{font:800 64px/1.02 var(--head);letter-spacing:-.01em;text-wrap:balance;margin:0}
.h2{font:800 38px/1.1 var(--head);margin:0;text-wrap:balance}
.lead{font:600 22px/1.4 var(--body);color:var(--muted);max-width:520px}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(31,42,68,.16);padding:18px 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--body);padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff}
.tag{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.live{background:var(--teal);color:#fff}.sched{background:#E7E9F0;color:var(--ink)}
.ex{position:absolute;right:28px;bottom:70px;font:700 12px var(--body);color:var(--muted);background:#fff;padding:4px 10px;border-radius:999px;z-index:5}
.bub{border-radius:18px;padding:12px 16px;font:600 18px/1.35 var(--body);max-width:440px}
.me{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.ai{background:#fff;box-shadow:0 8px 24px rgba(31,42,68,.12);border-bottom-left-radius:4px}
.line{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 8px;border-radius:8px;font:800 16px var(--body);color:#fff}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.fade{animation:fade .8s ease var(--d,0s) both}
.left{animation:left .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.4s ease var(--d,0s) forwards}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.zoom{animation:zoom 30s linear both}
@keyframes in{from{opacity:0;transform:translateY(28px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fade{from{opacity:0}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes zoom{to{transform:scale(1.12)}}
@keyframes ring{from{transform:scale(.05);opacity:.9}to{transform:scale(1);opacity:.55}}
@keyframes fall{from{transform:translateY(-80px);opacity:0}15%{opacity:1}to{transform:translateY(520px);opacity:1}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes run{to{offset-distance:100%}}
@keyframes count{from{--n:0}}
@keyframes swap1{0%,35%{transform:translateY(0)}55%,100%{transform:translateY(var(--to))}}
model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
@media (prefers-reduced-motion:reduce){#scene *{animation-duration:.01s!important;animation-iteration-count:1!important}}

<script>(() => { /* hide the loading screen as soon as the voice is really playing */
  const ov = document.getElementById('mai-load');
  const hide = () => ov.classList.add('off');
  if (/[?&](t=|autoplay=0)/.test(location.search)) { hide(); return; }
  const watch = a => { const ok = () => { if (a.currentTime > 0.02 && !a.paused) hide(); }; a.addEventListener('timeupdate', ok); a.addEventListener('playing', ok); };
  const find = () => { const a = document.querySelector('audio'); if (a) watch(a); else setTimeout(find, 50); };
  find(); setTimeout(hide, 9000);
  window.__maiLoaderShow = () => ov.classList.remove('off');
})();</script>

<script>
const PNG={"ui/companion":"media/24164e7ba849.png","ui/game":"media/9241b8e95c25.png","ui/group":"media/8dd3fb2e7dfa.png","ui/hero":"media/dd411fc86688.png","ui/map":"media/6c4eee114177.png","ui/tour":"media/461330953bb1.png","ui/weather":"media/3a8e9df80c81.png","waiter/bridge":"media/ebe301c986ec.png","waiter/order":"media/f3dc4e9437c2.png","waiter/step1":"media/052743335b21.png","waiter/step2":"media/1fc408c0252d.png","waiter/step3":"media/280a92c1e57d.png","waiter/step5":"media/bf3340ccde2e.png"};

const PHONE = (shot, { x, y, w = 300, h = 600, scroll = 0, d: dl = 0, tilt = 0, sdur = 6, sdel = 1.5 } = {}) => {
  const k = (w - 20) / 440;
  return `<div class="abs phonein" style="--d:${dl}s;left:${x}px;top:${y}px;width:${w}px;height:${h}px;--tilt:${tilt}deg">
    <div style="width:100%;height:100%;border-radius:38px;background:#1F2A44;padding:10px;box-sizing:border-box;box-shadow:0 30px 70px rgba(31,42,68,.35)">
      <div style="width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff;position:relative">
        <img fetchpriority="low" src="${PNG[shot]}" alt="" style="width:100%;display:block;animation:cardscroll ${sdur}s ease-in-out ${dl + sdel}s both;--sy:${-scroll * k}px">

};
