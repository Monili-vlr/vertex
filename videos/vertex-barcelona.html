<style>
/* Layout: a fixed 1280x720 stage scaled to fit, HUD (scene title, progress, subtitles) over it. Single look: the app's own sunny palette. */
:root{--cream:#FFF8EC;--ink:#1F2A44;--coral:#FF6B4A;--brand:#D9480F;--teal:#06A97F;--sun:#FFC21A;--blue:#4C6FFF;--pink:#FF3D7F;--violet:#845EF7;--night:#141B2E;--line:#E9DFCC;--muted:#5B6478;
--head:'Unbounded','Arial Black',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--cream);position:absolute;left:50%;top:50%;transform-origin:center;border-radius:18px}
#scene{position:absolute;inset:0}
#top{position:absolute;left:28px;top:22px;z-index:20;display:flex;gap:12px;align-items:center}
#top img{width:42px;height:42px;border-radius:10px}
#stitle{font:800 15px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:9px 14px;border-radius:999px}
#cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(980px,90%);text-align:center;font:600 19px/1.4 var(--body);color:#fff;background:rgba(20,27,46,.78);padding:8px 16px;border-radius:12px;z-index:20}
#cap[hidden]{display:none}
#bar{position:absolute;left:28px;right:28px;bottom:16px;height:8px;display:flex;gap:4px;z-index:20}
#bar button{flex:var(--w);border:0;padding:0;border-radius:4px;background:rgba(31,42,68,.18);cursor:pointer;position:relative;overflow:hidden}
#bar button i{position:absolute;inset:0;width:0;background:var(--coral)}
#bar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#help{position:absolute;right:28px;top:26px;z-index:20;font:600 13px var(--body);color:var(--ink);background:rgba(255,255,255,.85);padding:7px 12px;border-radius:999px}
#pausedTag{position:absolute;inset:0;display:none;place-items:center;z-index:30;background:rgba(20,27,46,.35);font:800 40px var(--head);color:#fff}
body.paused #pausedTag{display:grid}
body.paused #scene *, body.paused #scene{animation-play-state:paused!important}
/* building blocks */
.abs{position:absolute}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--cream) 0%,rgba(255,248,236,.92) 42%,rgba(255,248,236,0) 75%)}
.h1{font:800 64px/1.02 var(--head);letter-spacing:-.01em;text-wrap:balance;margin:0}
.h2{font:800 38px/1.1 var(--head);margin:0;text-wrap:balance}
.lead{font:600 22px/1.4 var(--body);color:var(--muted);max-width:520px}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(31,42,68,.16);padding:18px 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--body);padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff}
.tag{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.live{background:var(--teal);color:#fff}.sched{background:#E7E9F0;color:var(--ink)}
.ex{position:absolute;right:28px;bottom:70px;font:700 12px var(--body);color:var(--muted);background:#fff;padding:4px 10px;border-radius:999px;z-index:5}
.bub{border-radius:18px;padding:12px 16px;font:600 18px/1.35 var(--body);max-width:440px}
.me{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.ai{background:#fff;box-shadow:0 8px 24px rgba(31,42,68,.12);border-bottom-left-radius:4px}
.line{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 8px;border-radius:8px;font:800 16px var(--body);color:#fff}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.fade{animation:fade .8s ease var(--d,0s) both}
.left{animation:left .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.4s ease var(--d,0s) forwards}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.zoom{animation:zoom 30s linear both}
@keyframes in{from{opacity:0;transform:translateY(28px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fade{from{opacity:0}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes zoom{to{transform:scale(1.12)}}
@keyframes ring{from{transform:scale(.05);opacity:.9}to{transform:scale(1);opacity:.55}}
@keyframes fall{from{transform:translateY(-80px);opacity:0}15%{opacity:1}to{transform:translateY(520px);opacity:1}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes run{to{offset-distance:100%}}
@keyframes count{from{--n:0}}
@keyframes swap1{0%,35%{transform:translateY(0)}55%,100%{transform:translateY(var(--to))}}
model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
@media (prefers-reduced-motion:reduce){#scene *{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<style id="mai-load-css">#mai-load{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--mai-load-bg,#10131B);transition:opacity .35s ease}
#mai-load.off{opacity:0;pointer-events:none}#mai-load i{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.85);animation:mai-spin .8s linear infinite}
@keyframes mai-spin{to{transform:rotate(360deg)}}</style>
<div id="mai-load" aria-label="Loading"><i></i></div>
<script>(() => { /* hide the loading screen as soon as the voice is really playing */
  const ov = document.getElementById('mai-load');
  const hide = () => ov.classList.add('off');
  if (/[?&](t=|autoplay=0)/.test(location.search)) { hide(); return; }
  const watch = a => { const ok = () => { if (a.currentTime > 0.02 && !a.paused) hide(); }; a.addEventListener('timeupdate', ok); a.addEventListener('playing', ok); };
  const find = () => { const a = document.querySelector('audio'); if (a) watch(a); else setTimeout(find, 50); };
  find(); setTimeout(hide, 9000);
  window.__maiLoaderShow = () => ov.classList.remove('off');
})();</script>

const G={"mariona":"media/7903eba281b6.glb","ona":"media/a811dba2a860.glb","dan":"media/794f01e5d311.glb","rio":"media/0798d72f9a67.glb"};
const d = (s) => `style="--d:${s}s"`;
const EX = '<div class="ex">Example data</div>';
const L = (n, c) => `<span class="line" style="background:${c}">${n}</span>`;
const S = [
{ t: 'Vertex Barcelona', v: "This is Vertex Barcelona. A travel companion for Barcelona that lives inside ChatGPT. It brings the local services of the city into the conversation, so its answers come from real sources, not from guesses.",
  h: () => `<div class="bg zoom" style="background-image:url(media/e236d306396f.webp)"></div><div class="veil"></div>
  <div class="abs" style="left:70px;top:150px;width:600px">
    <h1 class="h1 in">Barcelona,<br><span style="color:var(--brand)">live</span>, inside ChatGPT.</h1>
    <p class="lead in" ${d(.5)}>TMB live, maps and opening hours of the city. Answers grounded in real data.</p>
    <div class="in" ${d(1)} style="display:flex;gap:10px;flex-wrap:wrap;max-width:560px">
      ${['plan_route','get_departures','get_service_alerts','reachable_in_time','find_nearby','optimize_itinerary','mobility_get_vehicles'].map((x,i)=>`<span class="chip pop" ${d(1.2+i*.25)}>${x}</span>`).join('')}
    </div>
  </div>
  <div class="abs" style="right:80px;top:170px;display:grid;gap:14px;justify-items:end">
    <div class="bub me in" ${d(3)}>How do I get to Barceloneta right now?</div>
    <div class="bub ai in" ${d(4.2)}>${L('L5','#0064B0')} then ${L('L4','#FFC21A')} · next train <span class="tag live">live</span></div>
  </div>` },
{ t: 'Barcelona, plugged in', v: 'Vertex Barcelona plugs ChatGPT into the city itself. Live TMB arrivals for metro and bus, and the official TMB journey planner. FGC, Rodalies and the tram. Bicing stations with free bikes and docks. The agenda of the City Council, concerts and matches, the sea at the beaches, local holidays, and what is open right now. All in one chat, always up to date.',
  h: () => `<div class="bg" style="background:radial-gradient(circle at 70% 40%,#FFE7C7,var(--cream) 62%)"></div>
  <div class="abs" style="left:640px;top:380px;width:1600px;height:1600px;margin:-800px 0 0 -800px;background:repeating-conic-gradient(rgba(255,107,74,.08) 0 9deg,transparent 9deg 18deg);animation:srcspin 50s linear infinite"></div>

{ t: 'Your companion', v: "First, pick your companion. Mariona, Ona, Dan and Sergi B, each with a personality and a voice, answer you inside the card. Catch the dragon in a game and he joins them. If you prefer plain chat, switch them off whenever you like.",
  h: () => `<div class="bg" style="background-image:url(media/5755542e6663.webp)"></div><div class="bg" style="background:linear-gradient(180deg,rgba(255,248,236,.2),rgba(255,248,236,.95) 78%)"></div>

  <div class="abs" style="left:50px;right:50px;top:150px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px">
  ${[['mariona','Mariona','Too cool for you','#FF3D7F'],['ona','Ona','The snarky nerd','#845EF7'],['dan','Dan','Zero filter','#E03131'],['rio','Sergi B','The charming slacker','#06C9A0']].map((c,i)=>`

      <div class="card" style="text-align:center;padding:10px 14px;border-top:5px solid ${c[3]}"><b style="font:800 20px var(--head)">${c[1]}</b><div style="color:var(--muted);font-weight:700">${c[2]}</div></div>
    </div>`).join('')}

      <svg viewBox="0 0 120 120" width="170" height="170" style="animation:bob 1.8s ease-in-out infinite"><ellipse cx="60" cy="112" rx="34" ry="6" fill="#1F2A44" opacity=".2"/><path d="M30 80q-6-40 30-46 36 6 30 46-30 20-60 0z" fill="#4CAF50"/><circle cx="48" cy="58" r="6" fill="#fff"/><circle cx="72" cy="58" r="6" fill="#fff"/><circle cx="49" cy="59" r="3" fill="#1F2A44"/><circle cx="73" cy="59" r="3" fill="#1F2A44"/><path d="M50 76q10 8 20 0" stroke="#1F2A44" stroke-width="3" fill="none"/><path d="M40 36l-6-14 14 8M80 36l6-14-14 8" fill="#FFC21A"/><path d="M88 70l22-8-14 18z" fill="#2E7D32"/></svg>
      <div class="card" style="text-align:center;padding:10px 14px;border-top:5px solid #4CAF50"><b style="font:800 20px var(--head)">Dragon</b><div style="color:var(--muted);font-weight:700">Unlock in Catchme</div></div>

{ t: 'Live journeys', v: "From Sagrada Familia to Barceloneta. Vertex plans the journey on the official TMB timetables. Line five to Verdaguer, then line four down to the sea. Where to board, where to get off, and when the next train leaves. Scheduled times are called scheduled, live times are called live.",

  <svg class="abs" viewBox="0 0 1280 720" style="inset:0">
    <path class="draw" ${d(.6)} d="M150 360 C 300 360 360 300 520 300" stroke="#0064B0" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path class="draw" ${d(2.2)} d="M520 300 C 680 300 700 470 880 470" stroke="#FFC21A" stroke-width="14" fill="none" stroke-linecap="round"/>

    <div style="display:flex;justify-content:space-between;align-items:center">${L('L5','#0064B0')}<b>board at Sagrada Família</b></div>
    <div style="display:flex;justify-content:space-between"><span>Next train</span><span><b>2 min</b> <span class="tag live">live</span></span></div>
    <div style="display:flex;justify-content:space-between">${L('L4','#FFC21A')}<b>change at Verdaguer</b></div>
    <div style="display:flex;justify-content:space-between"><span>Arrival</span><span><b>10:24</b> <span class="tag sched">scheduled</span></span></div>
    <div style="font-size:13px;color:var(--muted)">Source and time of data shown with every answer</div>
  </div>${EX}` },
{ t: 'Strikes and alerts', v: "Metro strikes, closed stations and bus diversions come straight from the official feeds. Before you leave, you know which lines are affected and until when.",
  h: () => `<h2 class="h2 abs in" style="left:70px;top:90px">Before you leave</h2>

<div id="mai-vc"><a class="bk" href="../#videos">&larr; Back to Vertex</a><button type="button" id="mai-fs">&#x26F6; Full screen</button></div>
<script>(() => { if (window.self === window.top) document.documentElement.classList.add('standalone');
  const box = document.getElementById('mai-vc'), b = document.getElementById('mai-fs');
  ['click', 'pointerdown', 'mousedown'].forEach(t => box.addEventListener(t, e => e.stopPropagation()));
  b.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); });
  document.addEventListener('fullscreenchange', () => { b.textContent = document.fullscreenElement ? '✕ Exit full screen' : '⛶ Full screen'; });
})();</script>
