function ensureFit() { if (fittedTo !== sel.body) { refit(sel.body); fittedTo = sel.body; for (const k in thumbs) delete thumbs[k]; } }
var fitReady = true; ensureFit();
// frame the body
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root, true), hgt = box.max.y - box.min.y, mid = box.getCenter(new THREE.Vector3());
floor.scale.setScalar(hgt * 0.7); floor.position.y = box.min.y + 0.002;
camera.position.set(0, mid.y + hgt * 0.04, hgt * 3.1); controls.target.copy(mid); controls.minDistance = hgt * 1.2; controls.maxDistance = hgt * 4; controls.update();
const mixer = new THREE.AnimationMixer(root), clip = (n) => gltf.animations.find((a) => a.name === n);
let idle = clip('idle') ? mixer.clipAction(clip('idle')) : null; if (idle) idle.play();
msg.remove(); document.getElementById('save').disabled = false;

// thumbnails: the same scene, framed on the part, rendered off-screen once per variant
const thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); thumbR.setSize(160, 160); thumbR.outputColorSpace = THREE.SRGBColorSpace;
const tcam = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
// [height of the centre, frame size] as fractions of the body: these companions have big heads, the torso sits low
const FRAME = { body: [0.5, 1.1], hair: [0.8, 0.42], face: [0.7, 0.34], hat: [0.9, 0.4], glasses: [0.7, 0.3], top: [0.33, 0.42], back: [0.36, 0.5], hand: [0.3, 0.45], bottom: [0.15, 0.36], shoes: [0.04, 0.24] };
function thumb(grp, idx) {
  const keep = sel[grp]; sel[grp] = idx; groups.forEach((g) => Object.entries(parts[g]).forEach(([i, ms]) => ms.forEach((m) => { m.visible = +i === sel[g]; }))); floor.visible = false;
  const [fy, fs] = FRAME[grp] || [0.5, 1]; const y = box.min.y + hgt * fy, d = hgt * fs * 1.9;
  const back = grp === 'back'; tcam.position.set(back ? 0 : d * 0.25, y + hgt * 0.02, back ? -d : d); tcam.lookAt(0, y, 0);
  thumbR.render(scene, tcam); const url = thumbR.domElement.toDataURL('image/png');
  sel[grp] = keep; groups.forEach((g) => Object.entries(parts[g]).forEach(([i, ms]) => ms.forEach((m) => { m.visible = +i === sel[g]; }))); floor.visible = true; return url;
}
function thumbOf(grp, idx) { const k = grp + '.' + idx; return thumbs[k] ||= thumb(grp, idx); }

// the options panel
const opts = document.getElementById('opts');
const slotLabel = (slot) => { const s = slot.replace(/^(top|bottom|shoes|hat|back|handL)_/, ''); return T.slots[s] || T.slots[slot] || s; };
const editable = (grp, slot) => grp === 'face' ? slot === 'eyes' : grp === 'body' ? slot === 'skin' : !/^fix_/.test(slot) && slot !== 'body_secondary';
function palette(grp, slot) { return grp === 'body' ? SKIN : grp === 'hair' ? HAIR : slot === 'eyes' ? EYES : CLOTH; }
function render(tab) {
  opts.innerHTML = '';
  TABS[tab].filter((grp) => parts[grp]).forEach((grp) => {
    const vs = variants(grp), sec = document.createElement('div'); sec.className = 'sec';
    const title = OPTIONAL.has(grp) ? T.extra[grp] : grp === 'body' ? T.build : (vs.length > 1 ? T.style : '');
    if (vs.length > 1 || OPTIONAL.has(grp)) {
      sec.innerHTML = (title ? '<h3>' + title + '</h3>' : '') + '<div class="vars"></div>';
      const box = sec.querySelector('.vars');
      if (OPTIONAL.has(grp)) { const b = document.createElement('button'); b.type = 'button'; b.className = 'var' + (sel[grp] === -1 ? ' on' : ''); b.innerHTML = '<span>' + T.none + '</span>'; b.onclick = () => { sel[grp] = -1; apply(); render(tab); }; box.appendChild(b); }
      vs.forEach((i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'var' + (sel[grp] === i ? ' on' : ''); b.innerHTML = '<img alt="" src="' + thumbOf(grp, i) + '">'; b.onclick = () => { sel[grp] = i; apply(); render(tab); }; box.appendChild(b); });
    }
    opts.appendChild(sec);
    if (sel[grp] < 0) return;
    const v = cat[grp].find((x) => x.id === grp + '.' + sel[grp]);
    (v ? v.slots : []).filter((s) => editable(grp, s.slot)).forEach((s) => {
      const row = document.createElement('div'); row.className = 'sec';
      const pal = palette(grp, s.slot), now = curColor(grp, s.slot);
      row.innerHTML = '<h3>' + slotLabel(s.slot) + '</h3><div class="sws">' + pal.map((c) => '<button type="button" class="sw' + (c.toLowerCase() === now.toLowerCase() ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join('') + '<input type="color" value="' + now + '" aria-label="+"></div>';
      row.querySelectorAll('.sw').forEach((b) => b.onclick = () => { setColor(grp, s.slot, b.dataset.c); render(tab); });
      row.querySelector('input').oninput = (e) => { setColor(grp, s.slot, e.target.value); };
      opts.appendChild(row);
    });
  });
}
let tab = 'body';
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b)); render(tab); });
render(tab);
// random: a sensible outfit in the shop's colours
const pick = (a) => a[Math.floor(Math.random() * a.length)];
document.getElementById('rand').onclick = () => {
  groups.forEach((grp) => { const vs = variants(grp); sel[grp] = OPTIONAL.has(grp) ? (Math.random() < 0.3 ? pick(vs) : -1) : pick(vs); });
  setColor('body', 'skin', pick(SKIN)); setColor('hair', 'hair', pick(HAIR)); setColor('face', 'eyes', pick(EYES));
  ['top', 'bottom', 'shoes', 'hat', 'back'].forEach((grp) => cat[grp] && cat[grp].forEach((v) => v.slots.forEach((s) => { if (editable(grp, s.slot)) setColor(grp, s.slot, pick(CLOTH)); })));
  apply(); for (const k in thumbs) delete thumbs[k]; render(tab);
};
document.getElementById('wave').onclick = () => { const c = clip('wave'); if (!c) return; const a = mixer.clipAction(c); a.reset(); a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = false; a.fadeIn(.2).play(); if (idle) idle.fadeOut(.2); setTimeout(() => { a.fadeOut(.3); if (idle) idle.reset().fadeIn(.3).play(); }, (c.duration * 1000) - 300); };
let spin = 0; document.getElementById('turn').onclick = () => { spin = Math.PI * 2; };
// the loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); mixer.update(dt); if (spin > 0) { const s = Math.min(spin, dt * 4); root.rotation.y += s; spin -= s; } controls.update(); renderer.render(scene, camera); });

// save: export what is visible (with the animations), material names back to the plain slot names the app expects
const saveBtn = document.getElementById('save'), err = document.getElementById('err');
saveBtn.onclick = async () => {
  saveBtn.disabled = true; saveBtn.textContent = T.saving; err.hidden = true;
  const names = []; root.traverse((o) => { if (o.isMesh) { names.push([o.material, o.material.name]); o.material.name = o.userData.slot; } });
  const rot = root.rotation.y; root.rotation.y = 0; root.updateMatrixWorld(true);
  try {
    const glb = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true, animations: gltf.animations });
    const r = await fetch('https://vertexhub.monili-vlr.workers.dev/character/upload', { method: 'POST', headers: { 'Content-Type': 'model/gltf-binary' }, body: glb });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'upload');
    document.getElementById('code').textContent = j.code; document.getElementById('result').hidden = false;
    try { localStorage.setItem('vertex.character.code', j.code); } catch (e) { /* ignore */ }
  } catch (e) { err.textContent = T.err; err.hidden = false; console.error(e); }
  finally { names.forEach(([m, n]) => { m.name = n; }); root.rotation.y = rot; saveBtn.disabled = false; saveBtn.textContent = T.save; }
};
document.getElementById('copy').onclick = () => { const c = document.getElementById('code').textContent; navigator.clipboard && navigator.clipboard.writeText(c).then(() => { document.getElementById('copy').textContent = T.copied; }); };
document.getElementById('result').onclick = (e) => { if (e.target.id === 'result') e.target.hidden = true; };
</script></body></html>
